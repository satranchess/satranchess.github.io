name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:        # can also be started by hand from the Actions tab (the latest video is updated then too)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Update the latest video
        env:
          # Optional: if you define a YT_API_KEY secret in the repository settings, the live-stream state is read reliably.
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python3 .github/update_video.py
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
